[package]
name = "r5e-endpoint-helper"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "Managed-endpoint supervisor, local MCP/subprocess Cedar policy gate, off-path session observer, and transparent user disclosure for R5E Enterprise"

[dependencies]
base64 = "0.22"
cedar-policy = "=4.9.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
